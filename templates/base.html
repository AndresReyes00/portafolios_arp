
{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <meta name="author" content="AndresReyes">
    <meta name="description" content="{% block meta_description %}Portafolio personal de Andres Reyes: desarrollo, análisis de datos y tecnología.{% endblock %}">

    <title>{% block title %}AndresReyes | Portafolio{% endblock %}</title>

    <!-- Bootstrap 5 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Bootstrap Icons -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
        rel="stylesheet"
    >

    {% block extra_css %}{% endblock %}
</head>

<body class="bg-light">

    <!-- Navbar -->
    {% include "./includes/navbar.html" %}

    <!-- Contenido principal -->
    <main class="flex-grow-1 min-vh-100 d-flex flex-column justify-content-center ">
        {% block content %}
        {% endblock %}
    </main>

    <!-- Footer -->
    <footer class="bg-dark text-white-50 py-4 mt-auto">
        <div class="container text-center">
            <p class="mb-1">
                <span class="text-white fw-semibold">AndresReyes</span>
                <i class="bi bi-code-slash text-info"></i>
            </p>

            <small>
                &copy; {% now "Y" %} AndresReyes. Todos los derechos reservados.
            </small>
        </div>
    </footer>

    <!-- Bootstrap 5 JavaScript + Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    {% block extra_js %}{% endblock %}

</body>
</html>
